name: publish

# Runs when a GitHub release is published (gh release create vX.Y.Z ...):
# builds the Python package and the NuGet package, checks that both carry the
# release version, and uploads them to PyPI (triordinal-dlist, triordinal-dtree,
# triordinal-dtree-explorer) and NuGet (Triordinal.DList, Triordinal.DTree). All packages share one
# version number. The Explorer's page is rebuilt from this commit and attached to the release.
# Both uploads use Trusted Publishing: no passwords or API keys are stored in the repository.

on:
  release:
    types: [published]
  workflow_dispatch:           # rerun for an existing tag: gh workflow run publish.yml --ref vX.Y.Z

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  pypi:
    # One job per package, each with its own GitHub environment (pypi-dlist, pypi-dtree, pypi-explorer):
    # PyPI identifies a trusted publisher by repository, workflow and environment, so each
    # project needs its own environment.
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # triordinal-dlist first, then triordinal-dtree, which needs it, then the Explorer
      matrix:
        package: [dlist, dtree, explorer]
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write          # PyPI Trusted Publishing, no token stored
      contents: write          # attach the Explorer's page to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Explorer's page
        if: matrix.package == 'explorer'
        working-directory: python/explorer
        run: python src/build.py
      - name: Test
        working-directory: python/${{ matrix.package }}
        run: python -m unittest discover -s tests
      - name: Check version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('python/${{ matrix.package }}/pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "python/${{ matrix.package }} version $v does not match tag $TAG"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build python/${{ matrix.package }} --outdir dist
      - name: Attach the Explorer's page to the release
        if: matrix.package == 'explorer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp python/explorer/dtree_explorer/explorer.html DTree-Explorer.html
          gh release upload "$TAG" DTree-Explorer.html --clobber
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true    # a rerun skips packages already on PyPI

  nuget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # NuGet Trusted Publishing, no long-lived API key stored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test
        run: dotnet run --project csharp/Triordinal.DTree.Tests -c Release
      - name: Pack
        run: |
          dotnet pack csharp/Triordinal.DList -c Release -o nupkg
          dotnet pack csharp/Triordinal.DTree -c Release -o nupkg
      - name: Check version
        run: |
          ls nupkg
          for p in Triordinal.DList Triordinal.DTree; do
            test -f "nupkg/$p.${TAG#v}.nupkg" || { echo "no $p package for version ${TAG#v}"; exit 1; }
          done
      - name: NuGet login (short-lived API key via OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}    # nuget.org profile name, not the email address
      - name: Push
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
